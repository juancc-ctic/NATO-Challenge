# Rutas y metadatos del proyecto.
project:
  name: nato-cuas
  timezone: UTC
  # CSV originales; enlaces de solo lectura.
  raw:
    test: data/raw/test
    eval: data/raw/eval
  # Tablas normalizadas y auditoría.
  interim: data/interim
  reports: reports
  out: out

# Parámetros del ETL y de la base de datos interim.
etl:
  # Elimina filas exactamente duplicadas por sensor e iteración.
  deduplicate: true
  # Conserva pájaros/coches para filtrarlos después; no se entregan.
  keep_non_drone: true
  # Escribe también una copia CSV además de Parquet.
  write_csv_copy: false
  # Compresión de los Parquet.
  parquet_compression: zstd
  # Sigma por defecto si el sensor no reporta error, en metros.
  default_sigma_m:
    radar: 15.0
    cyber: 50.0
    fusion: 20.0
    other: 50.0
    rf: 100.0
    acoustic: 50.0
    camera: 10.0
  # Límites de sigma tras convertir y recortar.
  sigma_floor_m: 0.5
  sigma_cap_m: 5000.0
  # Origen ENU local por iteración.
  enu:
    # Mediana de las posiciones de sensor válidas de la iteración.
    origin_mode: median_sensor_location
    # Origen de emergencia si no hay posiciones de sensor.
    fallback_origin:
      lat: 51.52
      lon: 5.86
      alt_m: 0.0
  # Velocidad máxima plausible para descartar saltos, en m/s.
  max_plausible_speed_mps: 90.0
  # Sensores cuyo location_* es posición del objeto.
  position_capable_sensor_types:
    - radar
    - cyber
    - fusion
    - other
  # Sensores que solo dan azimut/elevación, no posición.
  bearing_only_sensor_types:
    - rf
    - acoustic
    - camera
  # Sensores que solo existen en test.
  test_only_sensor_types:
    - fusion
  # Bandas de frecuencia para metadatos.
  frequency_bands_mhz:
    - name: 433 MHz
      min: 400
      max: 470
    - name: 868 MHz
      min: 850
      max: 930
    - name: 915 MHz
      min: 900
      max: 960
    - name: 1.2 GHz
      min: 1100
      max: 1300
    - name: 2.4 GHz
      min: 2300
      max: 2500
    - name: 5.8 GHz
      min: 5000
      max: 6000

# Política de splits: por iteración, nunca por fila.
splits:
  policy: group_by_iteration
  # Iteraciones con GT para train/validación.
  dev_split: test
  # Datasets sin GT, solo inferencia.
  holdout_split: eval
  # Un fold por iteración: validar con una, entrenar con el resto.
  leave_one_iteration_out: true
  random_state: 42

# Parámetros del tracker EKF.
tracker:
  # Dimensión de posición del estado: 2 o 3.
  state_dim: 3
  # Usa altitud cuando la detección la trae.
  use_altitude: true
  # Emite también tracks tentative.
  output_tentative: true
  # Prefiltro de detecciones, paso previo al tracking.
  prefilter:
    # none | range
    method: range
    # Descarta ecos de posición más lejanos que este radio, en metros.
    max_range_m: 5000.0
    # Excluye nodos de fusión y sensores solo-test.
    drop_fusion: true
    # Excluye detecciones clasificadas como no-dron.
    drop_non_drone: true
    # Futuro: outliers por saltos de velocidad/aceleración, max_alt_m,
    # min_det_conf y filtros por clase o sensor.
  # Movimiento y ruido de proceso.
  motion:
    model: constant_velocity
    # Aceleración eficaz del ruido de proceso, en m/s².
    process_noise_mps2: 2.0
    # Tope de dt para evitar Q desmedido en huecos largos, en s.
    max_dt_s: 5.0
  # Modelos de medida y ruido.
  measurement:
    use_elevation: false
    # Incertidumbre angular por tipo si la detección no la trae, en grados.
    sigma_az_deg:
      rf: 5.0
      acoustic: 10.0
      camera: 1.0
    # Sigma inicial de velocidad si el track nace sin ella, en m/s.
    initial_velocity_sigma_mps: 50.0
    # Sigma inicial de altitud si el track nace sin u, en m.
    initial_altitude_sigma_m: 1000.0
  # Gating: descarta asociaciones improbables antes del Húngaro.
  gating:
    method: chi2
    # Nivel de confianza de la distribución χ².
    confidence: 0.999
    # Si no es null, sustituye al χ² calculado por grados de libertad.
    chi2_gate: 100.0
    # Distancia máxima de asociación para medidas de posición, en metros.
    gate_distance_m: 300.0
  # Asociación uno-a-uno.
  association:
    method: hungarian
    cost_class_weight: 2.0
    cost_serial_weight: 1.0
    invalid_cost: 1.0e12
  # Ciclo de vida de tracks.
  lifecycle:
    hits_to_confirm: 3
    max_coast_s: 5.0
    max_tentative_misses: 3
    merge_distance_m: 100.0
    # Si es true, solo inicia tracks con clase de dron; más preciso, menos recall.
    initiate_from_drone_only: false
    # Sensores distintos que deben coincidir para iniciar un track desconocido.
    initiation_min_sensors: 2
    # Radio de coincidencia multisensor para iniciar, en metros.
    initiation_distance_m: 100.0
  # Postfiltro opcional de los tracks finales.
  postfilter:
    # none | fill_gaps | moving_average | plausibility
    method: none
    # Ventana del suavizado, en número de muestras.
    smooth_window: 5
    # Hueco máximo que se rellena por interpolación, en ms.
    max_gap_ms: 1000
    # Velocidad máxima plausible; descarta el track si la supera, en m/s.
    max_speed_mps: 90.0
  # Prefiltro/diagnóstico geométrico; no altera el baseline si está desactivado.
  geometry:
    enabled: false
    selection: greedy_logdet
    rank_tolerance: 1.0e-9

# Pesos y umbrales para clasificar por voto de sensores.
classification:
  sensor_weights:
    cyber: 1.5
    rf: 1.2
    radar: 1.0
    camera: 0.9
    acoustic: 0.7
    fusion: 0.8
    other: 0.8
  # Peso mínimo total para aceptar una clase; si no, Unknown.
  min_total_weight: 0.5
  # Tiempo mínimo para cambiar de clase.
  hysteresis_s: 5.0

# Métricas de evaluación de tracking.
evaluation:
  # Distancia de corte de GOSPA, en metros.
  gospa_c_m: 100.0
  # Exponente de GOSPA.
  gospa_p: 2.0
  # Distancia máxima para considerar un track emparejado, en metros.
  match_distance_m: 50.0

# Formato del Excel de entrega.
submission:
  # Rejilla fija de 100 ms según README_SubmissionTemplate.pdf §1.1.
  grid_ms: 100
  # Valor cuando no se sabe.
  empty_value: Unknown
  # Valor cuando no aplica.
  not_applicable: Not applicable
