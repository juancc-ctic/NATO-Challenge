# Rutas y metadatos del proyecto.
project:
  name: nato-cuas
  timezone: UTC
  # CSV originales; enlaces de solo lectura.
  raw:
    test: data/raw/test
    eval: data/raw/eval
  # Tablas normalizadas y auditoría.
  interim: data/interim
  reports: reports
  out: out

# Parámetros del ETL y de la base de datos interim.
etl:
  # Elimina duplicados por clave natural dentro de la misma iteración y sensor.
  # No usa `row_uid` porque incluye `raw_index` y no detecta copias repetidas.
  deduplicate: true
  # Clave natural: contenido de la detección, sin ids únicos de fila.
  deduplicate_key:
    - split_group
    - sensor_id
    - ts_ms
    - n
    - e
    - u
    - az_deg
    - el_deg
    - class_norm
    - serial_norm
  # Conserva pájaros/coches para filtrarlos después; no se entregan.
  keep_non_drone: true
  # Escribe también una copia CSV además de Parquet.
  write_csv_copy: false
  # Compresión de los Parquet.
  parquet_compression: zstd
  # Sigma por defecto si el sensor no reporta error, en metros.
  # Base: error mediano de detecciones emparejadas en `reports/labels/sensors.csv`
  # (horizontal y azimut) y MAD propio para `u`. No se ajusta con GOSPA.
  # `python scripts/calibrate_sigma.py` genera reports/sigma_calibration.csv.
  default_sigma_m:
    radar: {n: 35.0, e: 35.0, u: 65.0}
    cyber: {n: 25.0, e: 25.0, u: 30.0}
    fusion: {n: 21.0, e: 21.0, u: 18.0}
    other: {n: 6.0, e: 6.0, u: 2.0}
  # Un sigma reportado igual o mayor que el tope se trata como placeholder.
  sigma_cap_is_missing: true
  # Límites de sigma tras convertir y recortar.
  sigma_floor_m: 0.5
  sigma_cap_m: 5000.0
  # Origen ENU local por iteración.
  enu:
    # Mediana de las posiciones de sensor válidas de la iteración.
    origin_mode: median_sensor_location
    # Origen de emergencia si no hay posiciones de sensor.
    fallback_origin:
      lat: 51.52
      lon: 5.86
      alt_m: 0.0
  # Velocidad máxima plausible para descartar saltos, en m/s.
  # Se aplica en el ETL sobre `vn/ve/vu` reportados.
  max_plausible_speed_mps: 90.0
  # Sensores cuyo location_* es posición del objeto.
  position_capable_sensor_types:
    - radar
    - cyber
    - fusion
    - other
  # Sensores que solo dan azimut/elevación, no posición.
  bearing_only_sensor_types:
    - rf
    - acoustic
    - camera
  # Sensores que solo existen en test.
  test_only_sensor_types:
    - fusion
  # Bandas de frecuencia para metadatos.
  frequency_bands_mhz:
    - name: 433 MHz
      min: 400
      max: 470
    - name: 868 MHz
      min: 850
      max: 930
    - name: 915 MHz
      min: 900
      max: 960
    - name: 1.2 GHz
      min: 1100
      max: 1300
    - name: 2.4 GHz
      min: 2300
      max: 2500
    - name: 5.8 GHz
      min: 5000
      max: 6000

# Política de splits: por iteración, nunca por fila.
splits:
  policy: group_by_iteration
  # Iteraciones con GT para train/validación.
  dev_split: test
  # Datasets sin GT, solo inferencia.
  holdout_split: eval
  # Un fold por iteración: validar con una, entrenar con el resto.
  leave_one_iteration_out: true
  random_state: 42

# Prefiltro de detecciones, paso previo al tracker. Los filtros se combinan
# con AND: una detección se descarta si incumple cualquiera de ellos.
prefilter:
  # --- Método y radio ---
  method: range                 # none: sin filtro de distancia | range: usa max_range_m
  max_range_m: 5000.0           # metros desde el origen ENU; solo position

  # --- Limpieza común ---
  drop_fusion: true             # quita nodos fusion (solo test)
  drop_non_drone: true          # quita pájaros, animales, coches, etc.

  # --- Filtros por clase ---
  drop_class_norm:              # class_norm a descartar; vacío: no filtra
    - Unknown                   # Unknown: mayor lastre de cardinalidad en radar
  drop_class_norm_by_sensor: {} # {radar: [Unknown], ...}; vacío: no filtra

  # --- Filtros por sensor ---
  drop_sensor_types:            # tipos a descartar; vacío: no filtra
    - cyber                     # radar|cyber|fusion|other|rf|acoustic|camera
  keep_sensor_types: []         # si no vacío, conserva SOLO estos; gana a drop

  # --- Filtros por score ---
  min_det_conf: 0.9            # [0,1] confianza mínima de detección; null no filtra
  min_class_conf: null          # [0,1] confianza mínima de clase; null no filtra
  min_det_conf_by_sensor: {}    # {radar: 0.9, ...}; vacío: no filtra
  max_det_conf_by_sensor: {}    # {radar: 0.999, ...}; vacío: no filtra

  # --- Filtros por altitud ---
  max_alt_m: null               # metros; null no filtra; solo position
  min_alt_m: null               # metros; null no filtra; solo position
  # Futuro: outliers por saltos de velocidad/aceleración.

# Parámetros del tracker EKF.
# Baseline congelado: no cambiar valores sin registrar el experimento
# en README §Tracking. Cada cambio se valida en folds de `test`, uno a la vez.
tracker:
  # Dimensión de posición del estado: 2 o 3.
  # 3D CV es el baseline. `use_altitude=false` empeoró GOSPA/recall;
  # `state_dim=2` no se probó porque la evaluación es 3D.
  state_dim: 3
  # Usa altitud cuando la detección la trae. Mantener en true.
  use_altitude: true
  # Emite también tracks tentative.
  # false: no se emiten tentative; GOSPA baja y los ID switches caen.
  output_tentative: false
  # Movimiento y ruido de proceso.
  motion:
    model: constant_velocity
    # Aceleración eficaz del ruido de proceso, en m/s².
    # Mejor valor de la rejilla 0.1–2 en folds de test.
    process_noise_mps2: 2.0
    # Tope de dt para evitar Q desmedido en huecos largos, en s.
    max_dt_s: 5.0
  # Modelos de medida y ruido.
  measurement:
    use_elevation: false
    # Incertidumbre angular por tipo si la detección no la trae, en grados.
    # Base: error mediano de azimut en `reports/labels/sensors.csv`
    # (rf 6.9°, acústico 2.4°, cámara 0.4°) convertido a sigma.
    sigma_az_deg:
      rf: 10.0
      acoustic: 3.5
      camera: 0.6
    # Sigma inicial de velocidad si el track nace sin ella, en m/s.
    # Mejor valor de la rejilla 5–50 en los 6 folds de test.
    initial_velocity_sigma_mps: 50.0
    # Sigma inicial de altitud si el track nace sin u, en m.
    # GT `u` está en 3-123 m; 200 m cubre el rango.
    initial_altitude_sigma_m: 200.0
  # Gating: descarta asociaciones improbables antes del Húngaro.
  gating:
    method: chi2
    # Nivel de confianza de la distribución χ².
    # Inerte mientras `chi2_gate` no sea null.
    confidence: 0.999
    # Si no es null, sustituye al χ² calculado por grados de libertad.
    # Probado 13.8–100: 16.3 mejora GOSPA pero baja recall/ID.
    # Se mantiene 100.
    chi2_gate: 100.0
    # Distancia máxima de asociación para medidas de posición, en metros.
    # No se baja: el error típico GT→detección es 82–304 m.
    gate_distance_m: 300.0
  # Asociación uno-a-uno.
  association:
    method: hungarian
    # No tuneado: `d²` domina y clase/serial casi nunca informan.
    cost_class_weight: 2.0
    cost_serial_weight: 1.0
    invalid_cost: 1.0e12
  # Ciclo de vida de tracks.
  lifecycle:
    # Probado 2/3/4; 3 es el mejor.
    hits_to_confirm: 3
    # Tracks Unknown necesitan más hits para confirmar (probado 4/5; 5 mejor).
    hits_to_confirm_unknown: 5
    # Probado 1/2/3/5; 3 baja GOSPA sin perder recall.
    max_coast_s: 3.0
    # No tuneado; los tentative no se emiten.
    max_tentative_misses: 3
    # Probado 15/25/50/100; 100 sigue siendo el mejor GOSPA.
    merge_distance_m: 100.0
    # Si es true, solo inicia tracks con clase de dron; más preciso, menos recall.
    initiate_from_drone_only: false
    # Sensores distintos que deben coincidir para iniciar un track desconocido.
    initiation_min_sensors: 2
    # Ventana temporal para corroborar un inicio multisensor, en segundos.
    # Probado 0.25 s / 30 m: mejor GOSPA sin perder recall.
    initiation_window_s: 0.25
    # Radio de coincidencia multisensor para iniciar, en metros.
    initiation_distance_m: 30.0
    # Inicia tracks desde sensores solo-azimut (cámara/acústico/rf) con un
    # prior de rango; desactivado en el baseline.
    initiate_from_bearing: false
    # Bearings coherentes necesarios para confirmar un inicio solo-azimut.
    bearing_init_min_bearings: 3
    # Ventana temporal para corroborar esos bearings, en segundos.
    bearing_init_window_s: 2.0
    # Tolerancia angular entre bearings, en grados.
    bearing_init_angle_deg: 10.0
    # Rango previo para romper la ambigüedad de escala, en metros.
    bearing_init_range_m: 1000.0
    # Sigma del rango previo, en metros.
    bearing_init_range_sigma_m: 1000.0
    # Altitud previa de un track solo-azimut, en metros.
    bearing_init_altitude_m: 50.0
  # Postfiltro opcional de los tracks finales.
  # Inactivo en el baseline; sus parámetros son placeholders.
  postfilter:
    # none | fill_gaps | moving_average | plausibility
    method: none
    # Ventana del suavizado, en número de muestras.
    smooth_window: 5
    # Hueco máximo que se rellena por interpolación, en ms.
    max_gap_ms: 1000
    # Velocidad máxima plausible; descarta el track si la supera, en m/s.
    max_speed_mps: 90.0
  # Prefiltro/diagnóstico geométrico; no altera el baseline si está desactivado.
  geometry:
    enabled: false
    selection: greedy_logdet
    rank_tolerance: 1.0e-9

# Pesos y umbrales para clasificar por voto de sensores.
# Placeholder: el tracker actual no usa esta sección.
classification:
  sensor_weights:
    cyber: 1.5
    rf: 1.2
    radar: 1.0
    camera: 0.9
    acoustic: 0.7
    fusion: 0.8
    other: 0.8
  # Peso mínimo total para aceptar una clase; si no, Unknown.
  min_total_weight: 0.5
  # Tiempo mínimo para cambiar de clase.
  hysteresis_s: 5.0

# Preasignación de etiquetas: emparejar detecciones de test con el dron GT.
labels:
  # Detección y GT a más de este desfase no se comparan, en segundos.
  time_tolerance_s: 1.0
  # Puerta de distancia horizontal por tipo de sensor con posición, en metros.
  # Horizontal porque los sensores mezclan datums verticales (~70 m de offset).
  gate_m:
    radar: 100.0
    fusion: 100.0
    cyber: 150.0
    other: 150.0
    rf: 300.0
  # Puerta de error de azimut por tipo de sensor solo-rumbo, en grados.
  gate_deg:
    camera: 4.0
    acoustic: 10.0
    rf: 10.0
  # Posiciones a más de esta distancia del origen se tratan como inválidas.
  max_range_m: 20000.0
  # Desfase máximo explorado para detectar relojes desplazados, en segundos.
  offset_scan_s: 5.0
  # Voto por track crudo / serial: mínimo de detecciones y pureza para usarlo.
  vote_min_hits: 5
  vote_min_purity: 0.7
  # GT "estático": la etiqueta Dronetag no despega.
  static_gt:
    max_height_m: 10.0
    max_extent_m: 60.0
  # Tipo de dron según el nombre del modelo GT (primer token que coincida).
  model_types:
    heidrun: Fixed Wing
    vector: Fixed Wing
    rq: Fixed Wing
    fpv: Rotary Wing (FPV)
    skyranger: Rotary Wing
    dji: Rotary Wing
    mavic: Rotary Wing
    matrice: Rotary Wing
    autel: Rotary Wing
    anafi: Rotary Wing
    skydio: Rotary Wing

# Métricas de evaluación de tracking.
evaluation:
  # Distancia de corte de GOSPA, en metros. Métrica principal interna.
  # Con c=50 y p=2, cada GT no detectado o track falso cuesta c^2/2 = 1250.
  # Objetivo interno: GOSPA(c=50) < 50 m.
  gospa_c_m: 50.0
  # Exponente de GOSPA.
  gospa_p: 2.0
  # Corte secundario solo para comparación histórica.
  # No mezclar valores de distinto c en la misma tabla.
  gospa_c_reference_m: 100.0
  # Distancia máxima para considerar un track emparejado, en metros.
  # Solo se usa para contar ID switches; GOSPA usa gospa_c_m.
  match_distance_m: 50.0

# Formato del Excel de entrega.
submission:
  # Rejilla fija de 100 ms según README_SubmissionTemplate.pdf §1.1.
  grid_ms: 100
  # Valor cuando no se sabe.
  empty_value: Unknown
  # Valor cuando no aplica.
  not_applicable: Not applicable
